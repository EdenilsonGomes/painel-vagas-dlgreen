<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acesso ao Genesis IA Recruiting OS">
  <title>Entrar | Genesis IA</title>
  <meta name="theme-color" content="#073642">
  <script src="/theme-init.js?v=800"></script>
  <link rel="stylesheet" href="/login.css?v=800">
  <script src="/login.js?v=800" defer></script>
</head>
<body>
  <button id="loginThemeToggle" class="login-theme-toggle" type="button" aria-label="Ativar modo escuro">☾</button>
  <main class="login-shell">
    <section class="login-brand">
      <img class="brand-badge" src="/assets/brand/genesis-mark.svg" alt="" width="58" height="58">
      <p class="eyebrow">GENESIS IA</p>
      <h1>Bem-vindo à<br>Genesis IA</h1>
      <p>Sua central de recrutamento inteligente.</p>
      <div class="feature-list">
        <span>✓ Atendimento automatizado</span>
        <span>✓ Triagem e documentos</span>
        <span>✓ Agenda e observabilidade</span>
      </div>
    </section>
    <section class="login-card">
      <div>
        <p class="eyebrow">ACESSO SEGURO</p>
        <h2>Acessar sua conta</h2>
        <p>Entre com o usuário e a senha fornecidos pelo administrador.</p>
      </div>
      <form id="loginForm">
        <label><span>Usuário</span><input id="usuario" name="usuario" autocomplete="username" required autofocus></label>
        <label><span>Senha</span><div class="password-field"><input id="senha" name="senha" type="password" autocomplete="current-password" required><button id="togglePassword" type="button" aria-label="Mostrar senha">Mostrar</button></div></label>
        <div id="loginError" class="login-error hidden" role="alert"></div>
        <button id="loginButton" class="login-button" type="submit">Entrar no Genesis IA</button>
      </form>
      <small>O acesso expira automaticamente por segurança.</small>
    </section>
  </main>
</body>
</html>
